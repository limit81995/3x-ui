name: 3xui-speed-tc-local

services:
  panel:
    image: 3xui-speed:tc-local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 3xui-speed-tc-local
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: Asia/Shanghai
      XUI_PORT: "12053"
      XUI_INIT_WEB_BASE_PATH: "/"
      XUI_ENABLE_FAIL2BAN: "false"
    volumes:
      - panel-data:/etc/x-ui
    restart: unless-stopped

volumes:
  panel-data:
    name: 3xui-speed-tc-local-db
